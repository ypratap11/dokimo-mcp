# Smithery configuration for the Dokimo MCP server.
# https://smithery.ai/docs
#
# Local (stdio) MCP server. No configuration or secrets required: its tools call
# Dokimo's public endpoints and do a pure local Merkle recompute.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    required: []
  commandFunction: |-
    (config) => ({
      command: "dokimo-mcp",
      args: []
    })
