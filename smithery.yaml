# Smithery configuration — hosted (custom container) deployment.
# https://smithery.ai/docs/build/deployments/custom-container
#
# Smithery builds the Dockerfile and hosts the server, exposing MCP Streamable
# HTTP at /mcp on the PORT it injects (8081). No configuration or secrets are
# required: the tools call Dokimo's public endpoints and do a pure local Merkle
# recompute.
runtime: "container"
build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."
startCommand:
  type: "http"
  configSchema:
    type: "object"
    properties: {}
    required: []
